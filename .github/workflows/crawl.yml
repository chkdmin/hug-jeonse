name: Crawl Properties

on:
  # 회차가 마감돼 자동 크롤을 중단한 상태.
  # 회차 공백기(목록 0건)에는 크롤 API가 500을 반환해 실패 알림이 매시간 뜬다.
  # 다음 회차가 열리면 아래 schedule 블록의 주석을 해제할 것.
  # schedule:
  #   # 매시간 실행 (UTC 기준)
  #   - cron: '0 * * * *'
  workflow_dispatch: # 수동 실행

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Call Crawl API
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.VERCEL_URL }}/api/crawl")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Status: $http_code"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Crawl completed successfully"
          else
            echo "❌ Crawl failed with status $http_code"
            exit 1
          fi
