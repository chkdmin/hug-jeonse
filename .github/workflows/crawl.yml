name: Crawl Properties

on:
  # 자동 스케줄 비활성화 (회차 공백기 동안 0건 실패 방지)
  # 다음 모집 회차가 뜨면 아래 schedule 블록 주석을 해제하세요.
  # schedule:
  #   # 매시간 실행 (UTC 기준)
  #   - cron: '0 * * * *'
  workflow_dispatch: # 수동 실행만 허용

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Call Crawl API
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.VERCEL_URL }}/api/crawl")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Status: $http_code"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Crawl completed successfully"
          else
            echo "❌ Crawl failed with status $http_code"
            exit 1
          fi
